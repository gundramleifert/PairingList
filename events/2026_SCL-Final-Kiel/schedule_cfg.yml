# SAILING Champions League Final 2026, Kiel.
# From "Pairing List SCL Final 2026 Kiel.xlsx": 24 clubs on six J/70. The sheet names
# the boats but gives neither colours nor a flight count; both are taken from the 2025
# final in Kiel (2025-07-11_SCL-Kiel): 16 flights, and the colour each boat number had
# there. Teams are the sheet's club codes in its order. It lists YCG twice — Yacht Club
# Granville (FRA) and Yacht Club Gdansk (POL) — so both carry their country, the way the
# sheet itself writes BYC (AUT) and BYC (GER).
